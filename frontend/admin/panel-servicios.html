<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel de Servicios — Barber System</title>
  <link rel="icon" href="../img/logo-blue.svg" type="image/png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link href="../css/styles.css" rel="stylesheet">
</head>
<body class="admin-panel">

  <!-- Sidebar Mobile Toggle -->
  <button class="btn btn-outline-light d-lg-none m-3 position-fixed top-0 start-0 z-3" id="sidebarToggle" aria-label="Menu" style="background:var(--bg-card); border-color:rgba(255,255,255,0.1);">
    <i class="bi bi-list"></i>
  </button>

  <!-- Sidebar Drawer Overlay (mobile) -->
  <div class="sidebar-overlay d-lg-none" id="sidebarOverlay"></div>

  <!-- Sidebar -->
  <nav class="sidebar d-flex flex-column h-100 p-3 bg-card" id="sidebar" style="position:fixed; width:280px; z-index:100; border-right:1px solid rgba(255,255,255,0.08);">
    <div class="d-flex align-items-center gap-3 mb-4 mt-2 px-2">
      <img src="../img/logo-blue.svg" alt="Logo" style="height:40px; border-radius:8px;">
      <div>
        <h5 class="mb-0 fw-bold text-gradient" style="font-family:'Inter',sans-serif;" id="sidebarBarberName">Admin Panel</h5>
        <small class="text-muted-th">Barber System</small>
      </div>
    </div>
    
    <div class="nav flex-column gap-2" id="nav-tabs" role="tablist">
      <a href="panel-turnos.html" class="nav-link text-light sidebar-nav-item py-2 px-3 rounded-3 d-flex align-items-center gap-3 text-decoration-none">
        <i class="bi bi-calendar-check text-primary"></i> Turnos
      </a>
      <a href="panel-estadisticas.html" class="nav-link text-light sidebar-nav-item py-2 px-3 rounded-3 d-flex align-items-center gap-3 text-decoration-none">
        <i class="bi bi-graph-up-arrow text-primary"></i> Estadísticas
      </a>
      <a href="panel-clientes.html" class="nav-link text-light sidebar-nav-item py-2 px-3 rounded-3 d-flex align-items-center gap-3 text-decoration-none">
        <i class="bi bi-people text-primary"></i> Clientes
      </a>
      <a href="panel-servicios.html" class="nav-link active sidebar-nav-item py-2 px-3 rounded-3 d-flex align-items-center gap-3 text-decoration-none">
        <i class="bi bi-scissors text-primary"></i> Servicios
      </a>
      <a href="panel-barberos.html" class="nav-link text-light sidebar-nav-item py-2 px-3 rounded-3 d-flex align-items-center gap-3 text-decoration-none">
        <i class="bi bi-person-badge text-primary"></i> Barberos
      </a>
    </div>

    <div class="mt-auto px-2">
      <hr class="border-secondary opacity-25">
      <a href="../index.html" class="nav-link text-light sidebar-nav-item py-2 d-flex align-items-center gap-3 mb-2 text-decoration-none">
        <i class="bi bi-box-arrow-up-right text-muted"></i> Ver sitio público
      </a>
      <a href="#" class="nav-link text-danger sidebar-nav-item py-2 d-flex align-items-center gap-3 text-decoration-none" id="btnLogout">
        <i class="bi bi-box-arrow-left"></i> Cerrar sesión
      </a>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="dashboard-main" style="margin-left:280px; padding:2rem;">
    <div class="dashboard-header d-flex justify-content-between align-items-end border-bottom border-secondary border-opacity-25 pb-3 mb-4">
      <div>
        <h2 class="mb-1">Servicios</h2>
        <p class="text-muted-th mb-0">Gestioná los servicios y precios de tu barbería</p>
      </div>
      <div>
        <button class="btn-primario" onclick="abrirModalServicio()">
          <i class="bi bi-plus-lg me-2"></i> Nuevo Servicio
        </button>
      </div>
    </div>

    <!-- Tabla Servicios -->
    <div class="card-glass border-0">
      <div class="table-responsive">
        <table class="table table-hover table-th mb-0">
          <thead>
            <tr>
              <th>Servicio</th>
              <th>Precio</th>
              <th class="text-end">Acciones</th>
            </tr>
          </thead>
          <tbody id="tabla-servicios">
            <!-- Render dinámico -->
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Modal Servicio -->
  <div class="modal fade" id="modalServicio" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content card-glass border-0">
        <div class="modal-header border-bottom border-secondary border-opacity-25">
          <h5 class="modal-title" id="modalTitle">Nuevo Servicio</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="formServicio">
            <input type="hidden" id="servicioId">
            <div class="mb-3 form-group-th">
              <label class="form-label">Nombre del Servicio</label>
              <input type="text" class="form-control" id="servicioNombre" required placeholder="Ej: Corte Clásico">
            </div>
            <div class="mb-3 form-group-th">
              <label class="form-label">Precio ($)</label>
              <input type="number" class="form-control" id="servicioPrecio" required placeholder="0.00" step="100">
            </div>
          </form>
        </div>
        <div class="modal-footer border-top border-secondary border-opacity-25">
          <button type="button" class="btn-secundario" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn-primario" onclick="guardarServicio()">Guardar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="../js/panel-servicios.js"></script>
</body>
</html>
