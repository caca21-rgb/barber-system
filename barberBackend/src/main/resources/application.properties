# ── Base de datos H2 (archivo persistente — los datos se guardan entre reinicios) ─
spring.datasource.url=jdbc:h2:file:./data/barberdb;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true

# ── Superadmin ────────────────────────────────────────────────────────────────
superadmin.email=${SUPERADMIN_EMAIL:gestion.barber@admin.io}
superadmin.password=${SUPERADMIN_PASSWORD:Barb3r$Zx!2026}

# ── JWT ──────────────────────────────────────────────────────────────────────
# En local se usa esta clave. En producción, usar variable de entorno JWT_SECRET
jwt.secret=${JWT_SECRET:barberSystemSecretKeyForJWT256BitsLongEnoughToBeSecure!2026XYZ}
jwt.expiration.ms=${JWT_EXPIRATION_MS:86400000}

# ── Email SMTP (Gmail) ───────────────────────────────────────────────────────
# Para activar en local, cambiar mail.enabled=true y configurar credenciales
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
# Modo simulación: true = solo loguea, no envía emails (para desarrollo)
mail.simulation.mode=${MAIL_SIMULATION_MODE:true}

# ── CORS ─────────────────────────────────────────────────────────────────────
allowed.origins=${ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:5500,http://127.0.0.1:5500}

# ── Consola H2 ───────────────────────────────────────────────────────────────
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── Scheduling ───────────────────────────────────────────────────────────────
spring.task.scheduling.pool.size=2