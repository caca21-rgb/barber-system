# ── Puerto (Render asigna el puerto dinámicamente via $PORT) ────────────────
server.port=${PORT:8080}

# ── Base de datos (H2 por defecto, PostgreSQL en producción via variables de entorno) ─
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/barberdb;AUTO_SERVER=TRUE}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true
# SSL requerido por Neon y otros PostgreSQL en la nube
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ── Superadmin ────────────────────────────────────────────────────────────────
superadmin.email=${SUPERADMIN_EMAIL:superadmin@barbersystem.com}
superadmin.password=${SUPERADMIN_PASSWORD:admin123}

# ── JWT ──────────────────────────────────────────────────────────────────────
# En local se usa esta clave. En producción, usar variable de entorno JWT_SECRET
jwt.secret=${JWT_SECRET:barberSystemSecretKeyForJWT256BitsLongEnoughToBeSecure!2026XYZ}
jwt.expiration.ms=${JWT_EXPIRATION_MS:86400000}

# ── Email SMTP (Gmail) ───────────────────────────────────────────────────────
# Para activar en local, cambiar mail.enabled=true y configurar credenciales
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
# Modo simulación: true = solo loguea, no envía emails (para desarrollo)
mail.simulation.mode=${MAIL_SIMULATION_MODE:true}

# ── CORS ─────────────────────────────────────────────────────────────────────
allowed.origins=${ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:5500,http://127.0.0.1:5500}

# ── Consola H2 ───────────────────────────────────────────────────────────────
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── Scheduling ───────────────────────────────────────────────────────────────
spring.task.scheduling.pool.size=2