# ── Production Profile ──────────────────────────────────────────────────────
# Activar con: SPRING_PROFILES_ACTIVE=prod
# Las variables sensibles DEBEN venir de variables de entorno (sin fallback).
# StartupValidator valida en el arranque que estén todas presentes.

# ── Base de datos PostgreSQL ─────────────────────────────────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# validate: verifica que el esquema de BD coincide con las entidades.
# Si hay discrepancias, el servidor no arranca (más seguro que "update").
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ── JWT ──────────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET}
jwt.expiration.ms=${JWT_EXPIRATION_MS:86400000}

# ── Email SMTP (Gmail) ───────────────────────────────────────────────────────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
mail.simulation.mode=${MAIL_SIMULATION_MODE:false}

# ── CORS ─────────────────────────────────────────────────────────────────────
allowed.origins=${ALLOWED_ORIGINS}

# ── Superadmin ───────────────────────────────────────────────────────────────
# Sin fallback — StartupValidator lanzará error explícito si faltan.
superadmin.email=${SUPERADMIN_EMAIL}
superadmin.password=${SUPERADMIN_PASSWORD}

# ── H2 Console DESHABILITADA en producción ───────────────────────────────────
spring.h2.console.enabled=false

# ── Actuator: solo exponer health e info ─────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# ── Scheduling ───────────────────────────────────────────────────────────────
spring.task.scheduling.pool.size=2
