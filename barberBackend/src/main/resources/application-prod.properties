# ── Production Profile ──────────────────────────────────────────────────────
# Todas las variables sensibles vienen de variables de entorno de Railway

# ── Base de datos PostgreSQL ─────────────────────────────────────────────────
spring.datasource.url=${DATABASE_URL}
spring.datasource.driverClassName=org.postgresql.Driver
# spring.datasource.username=${PGUSER:postgres}
# spring.datasource.password=${PGPASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ── JWT ──────────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET}
jwt.expiration.ms=${JWT_EXPIRATION_MS:86400000}

# ── Email SMTP (Gmail) ───────────────────────────────────────────────────────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ── CORS (dominio de producción) ─────────────────────────────────────────────
allowed.origins=${ALLOWED_ORIGINS:http://localhost:3000}

# ── Superadmin ───────────────────────────────────────────────────────────────
superadmin.email=${SUPERADMIN_EMAIL}
superadmin.password=${SUPERADMIN_PASSWORD}

# ── H2 Console deshabilitada en prod ─────────────────────────────────────────
spring.h2.console.enabled=false

# ── Scheduling (notificaciones) ──────────────────────────────────────────────
spring.task.scheduling.pool.size=2
