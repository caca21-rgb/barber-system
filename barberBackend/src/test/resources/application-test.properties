# ── Test profile (H2 en memoria) ─────────────────────────────────────────────
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true

# JWT para tests
jwt.secret=testSecretKeyForTestingPurposesOnly1234567890ABC

# Superadmin para tests
superadmin.email=superadmin@test.com
superadmin.password=testpassword

# Email — modo simulación
mail.simulation.mode=true
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=

# CORS para tests
allowed.origins=http://localhost:3000
