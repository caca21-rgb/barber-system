<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registro — Barber System</title>
  <meta name="description" content="Registrá tu barbería y empezá a gestionar tus turnos." />
  <link rel="icon" href="../img/logo-blue.svg" type="image/png" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" />
  <link href="../css/styles.css" rel="stylesheet" />
  <style>
    /* Similar al login pero para registro */
    .login-page { min-height: 100vh; display: grid; grid-template-columns: 1fr 1fr; }
    @media (max-width: 991px) {
      .login-page { grid-template-columns: 1fr; }
      .login-visual { display: none !important; }
    }
    .login-visual {
      background: linear-gradient(135deg, rgba(10,10,15,0.7) 0%, rgba(12,10,5,0.5) 100%);
      background-color: var(--bg-card); display: flex; flex-direction: column;
      justify-content: center; align-items: center; padding: 4rem 3rem;
      position: relative; overflow: hidden; border-right: 1px solid rgba(99,102,241,0.1);
    }
    .visual-quote { font-family: 'Inter', sans-serif; font-size: 2rem; font-style: italic; color: var(--cream); line-height: 1.3; text-align: center; margin-bottom: 1.5rem; }
    .visual-quote span { color: var(--gold-light); }
    .login-form-side { display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 3rem 2rem; position: relative; overflow: hidden; }
    .login-box { width: 100%; max-width: 480px; position: relative; z-index: 1; }
    
    .input-icon-group { position: relative; }
    .input-icon-group .input-icon { position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; transition: var(--transition); }
    .input-icon-group .form-control { padding-left: 3rem; }
    .input-icon-group .form-control:focus ~ .input-icon { color: var(--primary); }
    
    .login-error {
      background: var(--danger-dim); border: 1px solid var(--danger); border-radius: var(--radius-md);
      padding: 0.85rem 1rem; color: var(--danger); font-size: 0.875rem; display: flex; align-items: center; gap: 0.6rem;
    }
    .form-group-th { margin-bottom: 1.1rem; }
    .btn-loading { opacity: 0.85; pointer-events: none; }
  </style>
</head>
<body class="admin-panel">

<div class="login-page">
  <!-- Visual side -->
  <div class="login-visual">
    <a href="../index.html" class="d-flex align-items-center gap-2 text-decoration-none mb-5">
      <img src="../img/logo-blue.svg" alt="Barber System" style="height:48px; border-radius:8px;" />
      <span class="fw-bold text-gradient" style="font-family: 'Inter', sans-serif; font-size:1.2rem;">Barber System</span>
    </a>
    <blockquote class="visual-quote mb-4">
      "Llevá tu barbería<br/>
      <span>al siguiente nivel."</span>
    </blockquote>
  </div>

  <!-- Form side -->
  <div class="login-form-side">
    <div class="login-box">
      <div class="login-header text-center mb-4">
        <h1>Registrá tu barbería <span class="text-gradient">🚀</span></h1>
        <p class="text-muted-th mt-2">Creá tu cuenta gratis y empezá a gestionar turnos</p>
      </div>

      <div class="login-error d-none mb-4" id="regError">
        <i class="bi bi-exclamation-circle-fill"></i>
        <span id="regErrorMsg">Error en el registro.</span>
      </div>

      <form id="regForm" novalidate>
        <!-- Nombre del Negocio -->
        <div class="form-group-th">
          <label class="form-label">Nombre de tu Barbería</label>
          <div class="input-icon-group">
            <input type="text" class="form-control" id="nombreNegocio" placeholder="Ej: Barbería Vintage" required />
            <i class="bi bi-shop input-icon"></i>
          </div>
        </div>

        <!-- Email -->
        <div class="form-group-th">
          <label class="form-label">Correo Electrónico</label>
          <div class="input-icon-group">
            <input type="email" class="form-control" id="email" placeholder="tu@email.com" required />
            <i class="bi bi-envelope input-icon"></i>
          </div>
        </div>

        <!-- Teléfono -->
        <div class="form-group-th">
          <label class="form-label">Teléfono (opcional)</label>
          <div class="input-icon-group">
            <input type="tel" class="form-control" id="telefono" placeholder="+54 11 1234 5678" />
            <i class="bi bi-whatsapp input-icon"></i>
          </div>
        </div>

        <!-- Contraseña -->
        <div class="form-group-th">
          <label class="form-label">Contraseña</label>
          <div class="input-icon-group">
            <input type="password" class="form-control" id="password" placeholder="••••••••" required />
            <i class="bi bi-lock input-icon"></i>
          </div>
        </div>

        <button type="submit" class="btn-primario w-100 mt-4" id="btnRegister" style="padding:0.9rem;">
          <span class="btn-text">Crear Cuenta</span>
        </button>
      </form>

      <div class="text-center mt-4 pt-3 border-top border-secondary border-opacity-25">
        <p class="text-muted-th mb-2">¿Ya tenés cuenta?</p>
        <a href="login.html" class="btn-secundario w-100 justify-content-center">Iniciar Sesión</a>
      </div>
    </div>
  </div>
</div>

<script type="module">
  import { API_BASE_URL, setAuthToken } from '../js/config.js';

  const form = document.getElementById('regForm');
  const btn = document.getElementById('btnRegister');
  const errorBox = document.getElementById('regError');
  const errorMsg = document.getElementById('regErrorMsg');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.classList.add('d-none');

    const nombreNegocio = document.getElementById('nombreNegocio').value.trim();
    const email = document.getElementById('email').value.trim();
    const telefono = document.getElementById('telefono').value.trim();
    const contrasenia = document.getElementById('password').value;

    if (!nombreNegocio || !email || !contrasenia) {
      errorMsg.textContent = 'Nombre, email y contraseña son obligatorios.';
      errorBox.classList.remove('d-none');
      return;
    }

    btn.classList.add('btn-loading');
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Creando cuenta...';

    try {
      const res = await fetch(`${API_BASE_URL}/barberias/registro`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nombreNegocio, email, telefono, contrasenia })
      });

      if (res.ok) {
        const data = await res.json(); // { token, barberia }
        
        // Autologin
        setAuthToken(data.token, true);
        localStorage.setItem('adminEmail', email);
        localStorage.setItem('adminNombre', data.barberia.nombreNegocio);
        sessionStorage.setItem('barberia_admin', JSON.stringify({ id: data.barberia.id, slug: data.barberia.slug }));
        
        btn.innerHTML = '<i class="bi bi-check-circle me-2"></i> ¡Cuenta Creada!';
        btn.classList.replace('btn-primario', 'btn-success');
        
        // Redirigir al panel
        setTimeout(() => window.location.href = './panel-turnos.html', 1000);
      } else {
        const errText = await res.text();
        errorMsg.textContent = errText || 'Error al crear la cuenta. Probablemente el email ya esté en uso.';
        errorBox.classList.remove('d-none');
        btn.classList.remove('btn-loading');
        btn.innerHTML = '<span class="btn-text">Crear Cuenta</span>';
      }
    } catch (err) {
      console.error(err);
      errorMsg.textContent = 'Error de conexión con el servidor.';
      errorBox.classList.remove('d-none');
      btn.classList.remove('btn-loading');
      btn.innerHTML = '<span class="btn-text">Crear Cuenta</span>';
    }
  });
</script>
</body>
</html>
